services:
  frontend:
    image: ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG:-main}
    env_file:
      - ${ENV_FILE:-main.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
