# Scale override: extra Next.js instances. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
# Nginx should proxy to next_upstream (3000–3011). See docs/nginx-upstream-snippet.conf.

services:
  frontend-2:
    image: ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG:-main}
    env_file:
      - ${ENV_FILE:-main.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      frontend-redis:
        condition: service_started
    networks:
      - frontend-network
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

