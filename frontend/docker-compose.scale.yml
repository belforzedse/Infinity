      retries: 3
      start_period: 60s

  frontend-redis:
    container_name: frontend-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    volumes:
      - frontend_redis_data:/data
    ports:
      - "127.0.0.1:${FRONTEND_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend-network

volumes:
  frontend_redis_data:
    name: frontend_redis_data

networks:
  frontend-network:
    driver: bridge
