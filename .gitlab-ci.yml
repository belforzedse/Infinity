stages: [build, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(main|dev)$/'
      when: always
    - when: never

variables:
  STRAPI_DISABLE_SOURCEMAPS: "true"
  STRAPI_TELEMETRY_DISABLED: "true"
  ENABLE_LARGE_HEAP: "false"

  # Docker-in-Docker for buildx (dind service). Runner waits ~30s for services;
  # if dind is slow, .docker_build before_script waits up to ~90s for docker info.
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

# Use mirror from your registry so the runner can pull (same auth as gitlab-runner-helper).
.docker_build:
  image: registry.cyandm.org/bel4/infinity/docker:27
  services:
    # Arvan Docker mirror: same as registry-mirrors on a host (see .cursor/rules/docker-hub-mirror-arvan.mdc)
    - name: registry.cyandm.org/bel4/infinity/docker:27-dind
      alias: docker
      command: ["--registry-mirror=https://docker.arvancloud.ir"]
  tags: ["infinity"]
  before_script:
    - set -euo pipefail
    # Wait for dind to be ready (runner only waits ~30s; dind may need longer under load)
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info 2>/dev/null; then
          echo "Docker daemon ready."
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "Docker daemon did not become ready in time."
          exit 1
        fi
        echo "Attempt $i/30: Docker not ready, retrying in 3s..."
        sleep 3
      done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Use mirrored buildkit image to avoid Docker Hub auth issues
    - docker buildx create --use --driver docker-container --driver-opt image=registry.cyandm.org/bel4/infinity/buildkit:buildx-stable-1 || docker buildx create --use || true

.deploy_ssh:
  # Mirror alpine:3.20 into this project's registry (see .cursor/rules/docker-hub-mirror-arvan.mdc).
  image: $CI_REGISTRY_IMAGE/alpine:3.20
  tags: ["infinity"]
  before_script:
    - set -euo pipefail
    - |
      cp /etc/apk/repositories /tmp/apk.repositories.default
      sed -i 's|https://dl-cdn.alpinelinux.org/alpine|https://mirror.arvancloud.ir/alpine|g' /etc/apk/repositories
      if ! apk update; then
        echo "Arvan Alpine mirror unavailable; falling back to default Alpine repositories."
        cp /tmp/apk.repositories.default /etc/apk/repositories
        apk update
      fi
      apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Prefer File-type variable so the key is never echoed (more secure). Fallback to Variable content.
    - |
      if [ -f "$DEPLOY_SSH_KEY" ]; then
        cp "$DEPLOY_SSH_KEY" ~/.ssh/id_rsa
      else
        echo "$DEPLOY_SSH_KEY" | tr -d "\r" > ~/.ssh/id_rsa
      fi
      chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "${DEPLOY_PORT:-3031}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# -----------------------
# BACKEND BUILD
# -----------------------
backend:build:
  extends: .docker_build
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      changes: [apps/backend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables: { RUNTIME_TAG: "dev" }
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/backend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables: { RUNTIME_TAG: "main" }
    - when: never
  script:
    - |
      set -euo pipefail

      # Determine backend layout
      if [ -f apps/backend/package.json ]; then
        BUILD_CONTEXT="."
        MAIN_DOCKERFILE="apps/backend/main.Dockerfile"
        DEV_DOCKERFILE="apps/backend/dev.Dockerfile"
      else
        BUILD_CONTEXT="."
        MAIN_DOCKERFILE="main.Dockerfile"
        DEV_DOCKERFILE="dev.Dockerfile"
      fi

      DOCKERFILE="$MAIN_DOCKERFILE"
      if [ "$RUNTIME_TAG" = "dev" ] && [ -f "$DEV_DOCKERFILE" ]; then
        DOCKERFILE="$DEV_DOCKERFILE"
      fi

      if [ "${ENABLE_LARGE_HEAP}" = "true" ]; then
        NODE_OPTIONS_ARG="--max-old-space-size=4096"
      else
        NODE_OPTIONS_ARG=""
      fi

      IMAGE="$CI_REGISTRY_IMAGE/infinity-backend"
      CACHE_REF="$CI_REGISTRY_IMAGE/cache/infinity-backend:buildcache"

      docker buildx build \
        --file "$DOCKERFILE" \
        --tag "$IMAGE:$CI_COMMIT_SHA" \
        --tag "$IMAGE:$RUNTIME_TAG" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        --build-arg STRAPI_DISABLE_SOURCEMAPS="$STRAPI_DISABLE_SOURCEMAPS" \
        --build-arg STRAPI_TELEMETRY_DISABLED="$STRAPI_TELEMETRY_DISABLED" \
        --build-arg NODE_OPTIONS="$NODE_OPTIONS_ARG" \
        --push \
        "$BUILD_CONTEXT"

# -----------------------
# BACKEND DEPLOY
# -----------------------
backend:deploy:
  extends: .deploy_ssh
  stage: deploy
  needs: ["backend:build"]
  environment: $DEPLOY_ENV
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      changes: [apps/backend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        IMAGE_TAG: "dev"
        ENV_FILE: "dev.env"
        DEPLOY_ENV: "staging"
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/backend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        IMAGE_TAG: "main"
        ENV_FILE: "main.env"
        DEPLOY_ENV: "production"
    - when: never
  script:
    - |
      set -euo pipefail

      # Upload compose (base + scale + CI registry override)
      scp -P "${DEPLOY_PORT:-3031}" \
        apps/backend/docker-compose.yml apps/backend/docker-compose.scale.yml apps/backend/docker-compose.ci.yml apps/backend/docker-compose.scale.ci.yml \
        "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/infinity/backend/"

      # BACKEND_ENV_FILE: File type => path; Variable type => env content. Avoid echoing content to log.
      if [ -f "$BACKEND_ENV_FILE" ]; then
        cp "$BACKEND_ENV_FILE" "/tmp/$ENV_FILE"
      else
        printf '%s' "$BACKEND_ENV_FILE" > "/tmp/$ENV_FILE"
      fi
      scp -P "${DEPLOY_PORT:-3031}" "/tmp/$ENV_FILE" \
        "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/infinity/backend/$ENV_FILE"

      ssh -p "${DEPLOY_PORT:-3031}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -se" <<REMOTE
      	set -euo pipefail
      	cd /opt/infinity/backend

      	printf '%s' "$REGISTRY_PAT" | docker login registry.cyandm.org -u "$REGISTRY_USER" --password-stdin

      	export ENV_FILE="$ENV_FILE"
      	export DB_ENV_FILE=db.env
      	export REGISTRY_IMAGE_BASE="$CI_REGISTRY_IMAGE"
      	export IMAGE_TAG="$IMAGE_TAG"
      	mkdir -p public/uploads

      	DB_USER=\$(grep -E "^DATABASE_USERNAME=" "\$ENV_FILE" | tail -1 | cut -d= -f2-)
      	DB_PASS=\$(grep -E "^DATABASE_PASSWORD=" "\$ENV_FILE" | tail -1 | cut -d= -f2-)
      	DB_NAME=\$(grep -E "^DATABASE_NAME=" "\$ENV_FILE" | tail -1 | cut -d= -f2-)

      	echo "POSTGRES_USER=\${DB_USER}" > "\$DB_ENV_FILE"
      	echo "POSTGRES_PASSWORD=\${DB_PASS}" >> "\$DB_ENV_FILE"
      	echo "POSTGRES_DB=\${DB_NAME}" >> "\$DB_ENV_FILE"

      	pull_with_retry() {
      		local img="\$1"
      		for attempt in 1 2 3 4 5; do
      			if docker pull "\$img"; then return 0; fi
      			echo "pull failed for \$img (attempt \$attempt), retrying..."
      			sleep \$((attempt * 5))
      		done
      		return 1
      	}

      	pull_with_retry "postgres:16-alpine"
      	pull_with_retry "redis:7-alpine"
      	pull_with_retry "$CI_REGISTRY_IMAGE/infinity-backend:$IMAGE_TAG"
      	docker run --rm --entrypoint node "$CI_REGISTRY_IMAGE/infinity-backend:$IMAGE_TAG" \
      	  -e "const sharp=require('sharp'); console.log('sharp-runtime-ok', process.platform, process.arch, sharp.versions);"

      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file "\$ENV_FILE" down --remove-orphans || true
      	for c in infinity-strapi infinity-strapi-2 infinity-strapi-3 infinity-strapi-4 infinity-strapi-5 infinity-strapi-6; do docker rm -f "\$c" 2>/dev/null || true; done
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file "\$ENV_FILE" up -d infinity-postgres infinity-redis
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file "\$ENV_FILE" up -d --remove-orphans
      	docker image prune -f || true
      REMOTE

# -----------------------
# FRONTEND BUILD
# -----------------------
frontend:build:
  extends: .docker_build
  stage: build
  environment: $DEPLOY_ENV
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      changes: [apps/frontend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        RUNTIME_TAG: "dev"
        DOCKERFILE: "apps/frontend/dev.Dockerfile"
        DEPLOY_ENV: "staging"
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/frontend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        RUNTIME_TAG: "main"
        DOCKERFILE: "apps/frontend/main.Dockerfile"
        DEPLOY_ENV: "production"
    - when: never
  script:
    - |
      set -euo pipefail

      IMAGE="$CI_REGISTRY_IMAGE/infinity-frontend"
      CACHE_REF="$CI_REGISTRY_IMAGE/cache/infinity-frontend:buildcache"

      # Variables are automatically resolved from environment-scoped CI/CD variables
      # based on DEPLOY_ENV (production/staging). Set these in GitLab UI:
      # FRONTEND_API_BASE_URL, FRONTEND_IMAGE_BASE_URL, FRONTEND_STRAPI_TOKEN,
      # SITE_URL, FRONTEND_MATOMO_URL, FRONTEND_MATOMO_SITE_ID, FRONTEND_SENTRY_DSN
      docker buildx build \
        --build-arg NEXT_PUBLIC_API_BASE_URL="${FRONTEND_API_BASE_URL:-}" \
        --build-arg NEXT_PUBLIC_IMAGE_BASE_URL="${FRONTEND_IMAGE_BASE_URL:-}" \
        --build-arg NEXT_PUBLIC_STRAPI_TOKEN="${FRONTEND_STRAPI_TOKEN:-}" \
        --build-arg NEXT_PUBLIC_SITE_URL="${SITE_URL:-}" \
        --build-arg NEXT_PUBLIC_MATOMO_URL="${FRONTEND_MATOMO_URL:-}" \
        --build-arg NEXT_PUBLIC_MATOMO_SITE_ID="${FRONTEND_MATOMO_SITE_ID:-}" \
        --build-arg NEXT_PUBLIC_SENTRY_DSN="${FRONTEND_SENTRY_DSN:-}" \
        --build-arg STRAPI_BUILD_TIME_URL="${STRAPI_BUILD_TIME_URL:-}" \
        --build-arg STRAPI_INTERNAL_URL="${STRAPI_INTERNAL_URL:-}" \
        --build-arg GITHUB_SHA="$CI_COMMIT_SHA" \
        --file "$DOCKERFILE" \
        --tag "$IMAGE:$CI_COMMIT_SHA" \
        --tag "$IMAGE:$RUNTIME_TAG" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        --push \
        .

# -----------------------
# FRONTEND DEPLOY
# -----------------------
frontend:deploy:
  extends: .deploy_ssh
  stage: deploy
  needs: ["frontend:build"]
  environment: $DEPLOY_ENV
  rules:
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      changes: [apps/frontend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        IMAGE_TAG: "dev"
        ENV_FILE: "dev.env"
        DEPLOY_ENV: "staging"
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/frontend/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        IMAGE_TAG: "main"
        ENV_FILE: "main.env"
        DEPLOY_ENV: "production"
    - when: never
  script:
    - |
      set -euo pipefail

      scp -P "${DEPLOY_PORT:-3031}" \
        apps/frontend/docker-compose.yml apps/frontend/docker-compose.scale.yml apps/frontend/docker-compose.ci.yml apps/frontend/docker-compose.scale.ci.yml \
        "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/infinity/frontend/"

      # FRONTEND_ENV_FILE: File type => path; Variable type => env content. Avoid echoing content to log.
      if [ -f "$FRONTEND_ENV_FILE" ]; then
        cp "$FRONTEND_ENV_FILE" "/tmp/$ENV_FILE"
      else
        printf '%s' "$FRONTEND_ENV_FILE" > "/tmp/$ENV_FILE"
      fi
      scp -P "${DEPLOY_PORT:-3031}" "/tmp/$ENV_FILE" \
        "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/infinity/frontend/$ENV_FILE"

      ssh -p "${DEPLOY_PORT:-3031}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -se" <<REMOTE
      	set -euo pipefail
      	cd /opt/infinity/frontend

      	printf '%s' "$REGISTRY_PAT" | docker login registry.cyandm.org -u "$REGISTRY_USER" --password-stdin

      	export ENV_FILE="$ENV_FILE"
      	export REGISTRY_IMAGE_BASE="$CI_REGISTRY_IMAGE"
      	export IMAGE_TAG="$IMAGE_TAG"
      	sed -i "/^STRAPI_BUILD_TIME_URL=/d" "\$ENV_FILE" || true

      	pull_with_retry() {
      		local img="\$1"
      		for attempt in 1 2 3 4 5; do
      			if docker pull "\$img"; then return 0; fi
      			echo "pull failed for \$img (attempt \$attempt), retrying..."
      			sleep \$((attempt * 5))
      		done
      		return 1
      	}

      	pull_with_retry "$CI_REGISTRY_IMAGE/infinity-frontend:$IMAGE_TAG"
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file "\$ENV_FILE" down --remove-orphans || true
      	for c in infinity-frontend infinity-frontend-2 infinity-frontend-3 infinity-frontend-4 infinity-frontend-5 infinity-frontend-6 infinity-frontend-7 infinity-frontend-8 infinity-frontend-9 infinity-frontend-10 infinity-frontend-11 infinity-frontend-12; do docker rm -f "\$c" 2>/dev/null || true; done
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file "\$ENV_FILE" up -d --remove-orphans
      	docker image prune -f || true
      REMOTE

# -----------------------
# SOCIAL BUILD
# -----------------------
social:build:
  extends: .docker_build
  stage: build
  environment: production
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/social/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        RUNTIME_TAG: "main"
    - when: never
  script:
    - |
      set -euo pipefail

      IMAGE="$CI_REGISTRY_IMAGE/infinity-social"
      CACHE_REF="$CI_REGISTRY_IMAGE/cache/infinity-social:buildcache"

      docker buildx build \
        --build-arg NEXT_PUBLIC_API_BASE_URL="https://api.infinitycolor.co/api" \
        --build-arg NEXT_PUBLIC_IMAGE_BASE_URL="https://api.infinitycolor.co" \
        --build-arg NEXT_PUBLIC_SITE_URL="https://infinitygram.co" \
        --file "apps/social/main.Dockerfile" \
        --tag "$IMAGE:$CI_COMMIT_SHA" \
        --tag "$IMAGE:$RUNTIME_TAG" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        --push \
        .

# -----------------------
# SOCIAL DEPLOY
# -----------------------
social:deploy:
  extends: .deploy_ssh
  stage: deploy
  needs: ["social:build"]
  environment: production
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes: [apps/social/**/*, packages/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, turbo.json, .gitlab-ci.yml]
      variables:
        IMAGE_TAG: "main"
    - when: never
  script:
    - |
      set -euo pipefail

      ssh -p "${DEPLOY_PORT:-3031}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/infinity/social"
      scp -P "${DEPLOY_PORT:-3031}" \
        apps/social/docker-compose.yml apps/social/docker-compose.scale.yml apps/social/docker-compose.ci.yml apps/social/docker-compose.scale.ci.yml \
        "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/infinity/social/"

      ssh -p "${DEPLOY_PORT:-3031}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -se" <<REMOTE
      	set -euo pipefail
      	cd /opt/infinity/social

      	printf '%s' "$REGISTRY_PAT" | docker login registry.cyandm.org -u "$REGISTRY_USER" --password-stdin

      	export REGISTRY_IMAGE_BASE="$CI_REGISTRY_IMAGE"
      	export IMAGE_TAG="$IMAGE_TAG"

      	pull_with_retry() {
      		local img="\$1"
      		for attempt in 1 2 3 4 5; do
      			if docker pull "\$img"; then return 0; fi
      			echo "pull failed for \$img (attempt \$attempt), retrying..."
      			sleep \$((attempt * 5))
      		done
      		return 1
      	}

      	pull_with_retry "$CI_REGISTRY_IMAGE/infinity-social:$IMAGE_TAG"
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml down --remove-orphans || true
      	for c in infinity-social infinity-social-2 infinity-social-3 infinity-social-4; do docker rm -f "\$c" 2>/dev/null || true; done
      	docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml up -d --remove-orphans
      	docker image prune -f || true
      REMOTE
