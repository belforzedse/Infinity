# CI/GitLab override for scale compose: pull app images from registry.cyandm.org instead of ghcr.io.
# Used by .gitlab-ci.yml deploy. Use with docker-compose.scale.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.scale.yml -f docker-compose.scale.ci.yml --env-file ... up -d

services:
  strapi-2:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-3:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-4:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-5:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-6:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}
