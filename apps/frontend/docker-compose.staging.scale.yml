# Staging scale override: 4 total Next.js instances.
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.staging.scale.yml up -d --remove-orphans
# Nginx should proxy to next_upstream (3000, 3002-3004).

services:
  frontend-2:
    image: ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG:-dev}
    env_file:
      - ${ENV_FILE:-dev.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      frontend-redis:
        condition: service_started
    networks:
      - frontend-network
    ports:
      - "127.0.0.1:3004:3000"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend-3:
    image: ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG:-dev}
