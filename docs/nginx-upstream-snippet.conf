# Nginx upstream blocks for load-balanced frontend and backend.
# Include this at the top of your site config (before any server { } block), then use
#   proxy_pass http://next_upstream;
#   proxy_pass http://strapi_upstream;
# in the relevant location blocks. See docs/DOCKER-LOAD-SCALING-GUIDE.md.

# Next.js (5 instances: 3000–3004)
upstream next_upstream {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
    server 127.0.0.1:3004;
    keepalive 32;
}

# Strapi (4 instances). ip_hash preserves admin session per client.
upstream strapi_upstream {
    ip_hash;
    server 127.0.0.1:1337;
    server 127.0.0.1:1338;
    server 127.0.0.1:1339;
    server 127.0.0.1:1340;
    keepalive 32;
}
