# Nginx: Restrict site access to specific IP addresses
# Use this when you want only your IP (or a list) to access the site.
#
# HOW TO USE:
# 1. Replace YOUR_IP_HERE with your public IPv4 (e.g. 203.0.113.50).
#    Find your IP: https://whatismyip.com or run: curl -4 ifconfig.me
# 2. Add the "allow/deny" block inside the server { } block that serves your site,
#    before any location { } blocks (or inside location / { } at the top).
# 3. Test: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#
# To allow multiple IPs, add more "allow" lines:
#   allow 203.0.113.50;
#   allow 198.51.100.0/24;
#   deny all;
#
# To disable the restriction, remove the allow/deny block and reload nginx.

allow YOUR_IP_HERE;
deny all;
