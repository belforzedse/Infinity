# Nginx rate limiting for Infinity Store.
# Add the zones to the http { } block in /etc/nginx/nginx.conf.
# Add the limit_req/limit_conn directives inside the relevant location blocks
# in your site config (e.g. /etc/nginx/sites-available/infinitycolor.org).
# See docs/P0-SERVER-STEPS.md for full instructions.

# --- Add these inside http { } in /etc/nginx/nginx.conf ---
# limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Frontend (new.infinitycolor.co / infinitycolor.org) location / ---
# limit_req zone=general burst=100 nodelay;
# limit_conn conn_limit 50;

# --- API (api.infinitycolor.co) location / ---
# limit_req zone=api burst=60 nodelay;
# limit_conn conn_limit 30;

# --- API (api.infinitycolor.co) location ~ ^/api/auth/ ---
# limit_req zone=auth burst=10 nodelay;
