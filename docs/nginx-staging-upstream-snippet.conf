# Nginx upstream blocks for staging storefront and backend.
# Include this before any server { } block in the staging site config, then use:
#   proxy_pass http://next_upstream;
#   proxy_pass http://strapi_upstream;

# Next.js staging: 4 instances on 3000-3003.
upstream next_upstream {
    ip_hash;
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
    keepalive 32;
}

# Strapi staging: 2 instances on 1337 and 1339. ip_hash preserves admin sessions.
upstream strapi_upstream {
    ip_hash;
    server 127.0.0.1:1337;
    server 127.0.0.1:1339;
    keepalive 32;
}
