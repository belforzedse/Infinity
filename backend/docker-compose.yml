services:
  strapi:
    container_name: infinity-strapi
    image: ghcr.io/belforzedse/infinity-backend:${IMAGE_TAG:-main}
    env_file:
      - ${ENV_FILE:-main.env}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network

  infinity-matomo-db:
    container_name: infinity-matomo-db
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-main.env}
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:-matomo-root}
      MYSQL_DATABASE: ${MATOMO_DB_NAME:-matomo}
      MYSQL_USER: ${MATOMO_DB_USER:-matomo}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD:-matomo-password}
    volumes:
      - backend_matomo-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MATOMO_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infinity-network

  infinity-matomo:
    container_name: infinity-matomo
    image: matomo:5-apache
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-main.env}
    depends_on:
      infinity-matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: infinity-matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:-matomo-password}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME:-matomo}
      MATOMO_GENERAL_TRUSTED_HOSTS: ${MATOMO_TRUSTED_HOSTS:-localhost}
    volumes:
      - backend_matomo-data:/var/www/html
    ports:
      - "127.0.0.1:${MATOMO_PORT:-8081}:80"
    networks:
      - infinity-network

  infinity-postgres:
    container_name: infinity-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinity123}
      POSTGRES_DB: ${POSTGRES_DB:-infinity_local}
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - backend_infinity-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

  infinity-redis:
    container_name: infinity-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - backend_infinity-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

volumes:
  backend_infinity-postgres-data:
    external: true
    name: backend_infinity-postgres-data
  backend_infinity-redis-data:
    external: true
    name: backend_infinity-redis-data
  backend_uploads-data:
    external: true
    name: backend_uploads-data
  backend_matomo-db-data:
    external: true
    name: backend_matomo-db-data
  backend_matomo-data:
    external: true
    name: backend_matomo-data

networks:
  infinity-network:
    driver: bridge
