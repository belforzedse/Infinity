services:
  strapi:
    container_name: infinity-strapi
    image: ghcr.io/belforzedse/infinity-backend:${IMAGE_TAG:-main}
    env_file:
      - ${ENV_FILE:-main.env}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_started
    ports:
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1337/admin"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  infinity-postgres:
    container_name: infinity-postgres
    image: postgres:16-alpine
    command: >-
      postgres
      -c shared_buffers=20GB
      -c effective_cache_size=120GB
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c max_connections=300
      -c wal_buffers=64MB
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c huge_pages=try
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c log_min_duration_statement=500
      -c idle_in_transaction_session_timeout=30000
      -c statement_timeout=60000
    restart: unless-stopped
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinity123}
      POSTGRES_DB: ${POSTGRES_DB:-infinity_local}
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - backend_infinity-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

  infinity-redis:
    container_name: infinity-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 64gb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - backend_infinity-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

volumes:
  backend_infinity-postgres-data:
    external: true
    name: backend_infinity-postgres-data
  backend_infinity-redis-data:
    external: true
    name: backend_infinity-redis-data
  backend_uploads-data:
    external: true
    name: backend_uploads-data
networks:
  infinity-network:
    driver: bridge
