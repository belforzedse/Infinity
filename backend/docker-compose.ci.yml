# CI/GitLab override: pull app image from registry.cyandm.org instead of ghcr.io.
# Used by .gitlab-ci.yml deploy. REGISTRY_IMAGE_BASE is set on the server (e.g. registry.cyandm.org/bel4/infinity).
# Usage: docker compose -f docker-compose.yml -f docker-compose.scale.yml -f docker-compose.ci.yml --env-file ... up -d

services:
  strapi:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-2:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-3:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}

  strapi-4:
    image: ${REGISTRY_IMAGE_BASE}/infinity-backend:${IMAGE_TAG:-main}
