# Local Development Docker Compose
# Runs Strapi + PostgreSQL + Redis for local development

services:
  strapi:
    container_name: infinity-strapi-local
    build:
      context: .
      dockerfile: local.Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_HOST: infinity-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: infinity_local
      DATABASE_USERNAME: infinity
      DATABASE_PASSWORD: infinity123
      REDIS_URL: redis://:2768fwZiUEEfAJXfeo0lM5do2Ly3BPQccK36PfMQf5w=@infinity-redis:6379
      REDIS_PASSWORD: 2768fwZiUEEfAJXfeo0lM5do2Ly3BPQccK36PfMQf5w=
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command: npm run develop
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"
    restart: unless-stopped
    volumes:
      - .:/app
      - strapi-node-modules:/app/node_modules
      - uploads-data:/app/public/uploads
    networks:
      - infinity-network

  infinity-matomo-db:
    container_name: infinity-matomo-db-local
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: matomo-root
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo-password
    volumes:
      - matomo-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infinity-network

  infinity-matomo:
    container_name: infinity-matomo-local
    image: matomo:5-apache
    restart: unless-stopped
    depends_on:
      infinity-matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: infinity-matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo-password
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_GENERAL_TRUSTED_HOSTS: localhost
    volumes:
      - matomo-data:/var/www/html
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - infinity-network

  infinity-postgres:
    container_name: infinity-postgres-local
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity123
      POSTGRES_DB: infinity_local
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - infinity-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity -d infinity_local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

  infinity-redis:
    container_name: infinity-redis-local
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass 2768fwZiUEEfAJXfeo0lM5do2Ly3BPQccK36PfMQf5w=
    environment:
      - REDIS_PASSWORD=2768fwZiUEEfAJXfeo0lM5do2Ly3BPQccK36PfMQf5w=
    volumes:
      - infinity-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

volumes:
  strapi-node-modules:
  infinity-postgres-data:
  infinity-redis-data:
  uploads-data:
  matomo-db-data:
  matomo-data:

networks:
  infinity-network:
    driver: bridge
