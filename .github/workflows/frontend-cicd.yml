name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - dev
      - experimental
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/frontend-cicd.yml'
      - 'apps/frontend/docker-compose.scale.yml'
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/frontend-cicd.yml'
      - 'apps/frontend/docker-compose.scale.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: infinity-frontend

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, infinity]
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ (
          (github.ref == 'refs/heads/main'
            || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')) && 'production'
        ) || (
          (github.ref == 'refs/heads/dev'
            || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev')) && 'staging'
        ) || 'experimental' }}
    steps:
      - name: Free disk space (runner)
        run: |
          docker buildx prune -f 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          echo "--- Disk usage ---"
          df -h .

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for build version generation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Select Dockerfile and image tag
        id: meta
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            dev)
              DOCKERFILE="apps/frontend/dev.Dockerfile"
              RUNTIME_TAG="dev"
              ;;
            experimental)
              DOCKERFILE="apps/frontend/main.Dockerfile"
              RUNTIME_TAG="experimental"
              ;;
            *)
              DOCKERFILE="apps/frontend/main.Dockerfile"
              RUNTIME_TAG="main"
              ;;
          esac

          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=${RUNTIME_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.arvancloud.ir"]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_DEPLOY_USER }}
          password: ${{ secrets.GHCR_DEPLOY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.runtime_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.FRONTEND_API_BASE_URL }}
            NEXT_PUBLIC_IMAGE_BASE_URL=${{ secrets.FRONTEND_IMAGE_BASE_URL }}
            NEXT_PUBLIC_STRAPI_TOKEN=${{ secrets.FRONTEND_STRAPI_TOKEN }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}
            NEXT_PUBLIC_MATOMO_URL=${{ secrets.FRONTEND_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ secrets.FRONTEND_MATOMO_SITE_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.FRONTEND_SENTRY_DSN }}
            STRAPI_BUILD_TIME_URL=${{ secrets.FRONTEND_STRAPI_BUILD_TIME_URL }}
            NPM_REGISTRY_URL=${{ secrets.NPM_REGISTRY_URL || 'https://package-mirror.liara.ir/repository/npm/' }}
            NPM_REGISTRY_SECOND_FALLBACK_URL=${{ secrets.NPM_REGISTRY_SECOND_FALLBACK_URL || 'https://mirror-npm.runflare.com/' }}
            NPM_REGISTRY_FALLBACK_URL=${{ secrets.NPM_REGISTRY_FALLBACK_URL || 'https://registry.npmjs.org/' }}
            GITHUB_SHA=${{ github.sha }}

      - name: Upload docker-compose (prod)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          source: "apps/frontend/docker-compose.yml,apps/frontend/docker-compose.scale.yml"
          target: /opt/infinity/frontend/
          strip_components: 2

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/infinity/frontend
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_DEPLOY_USER }} --password-stdin
            cat <<-'EOF' > main.env
            ${{ secrets.FRONTEND_ENV_FILE }}
            EOF
            sed -i '/^STRAPI_BUILD_TIME_URL=/d' main.env
            export IMAGE_TAG=main
            export ENV_FILE=main.env
            # Work around intermittent containerd "lease does not exist" pull failures by pulling sequentially with retries.
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl restart docker 2>/dev/null || systemctl restart docker 2>/dev/null || true
            fi
            pull_with_retry() {
              local img="$1"
              local attempt
              for attempt in 1 2 3 4 5; do
                if docker pull "$img"; then
                  return 0
                fi
                echo "pull failed for $img (attempt $attempt), retrying..."
                sleep $((attempt * 5))
              done
              echo "pull failed for $img after retries"
              return 1
            }
            pull_with_retry "ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --remove-orphans
            if ! docker image prune -f; then
              echo "Skipped prune: another operation is already running."
            fi

      - name: Upload docker-compose (staging)
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          source: "apps/frontend/docker-compose.yml,apps/frontend/docker-compose.scale.yml"
          target: /opt/infinity/frontend/
          strip_components: 2

      - name: Deploy to staging
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/infinity/frontend
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_DEPLOY_USER }} --password-stdin
            cat <<-'EOF' > dev.env
            ${{ secrets.FRONTEND_ENV_FILE }}
            EOF
            sed -i '/^STRAPI_BUILD_TIME_URL=/d' dev.env
            export IMAGE_TAG=dev
            export ENV_FILE=dev.env
            # Work around intermittent containerd "lease does not exist" pull failures by pulling sequentially with retries.
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl restart docker 2>/dev/null || systemctl restart docker 2>/dev/null || true
            fi
            pull_with_retry() {
              local img="$1"
              local attempt
              for attempt in 1 2 3 4 5; do
                if docker pull "$img"; then
                  return 0
                fi
                echo "pull failed for $img (attempt $attempt), retrying..."
                sleep $((attempt * 5))
              done
              echo "pull failed for $img after retries"
              return 1
            }
            pull_with_retry "ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --remove-orphans
            if ! docker image prune -f; then
              echo "Skipped prune: another operation is already running."
            fi

      - name: Upload docker-compose (experimental)
        if: github.ref == 'refs/heads/experimental'
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          source: "apps/frontend/docker-compose.yml,apps/frontend/docker-compose.scale.yml"
          target: /opt/infinity/frontend/
          strip_components: 2

      - name: Deploy to experimental
        if: github.ref == 'refs/heads/experimental'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.FRONTEND_USER }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          port: ${{ secrets.FRONTEND_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/infinity/frontend
            echo "${{ secrets.GHCR_DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_DEPLOY_USER }} --password-stdin
            cat <<-'EOF' > main.env
            ${{ secrets.FRONTEND_ENV_FILE }}
            EOF
            sed -i '/^STRAPI_BUILD_TIME_URL=/d' main.env
            export IMAGE_TAG=experimental
            export ENV_FILE=main.env
            # Work around intermittent containerd "lease does not exist" pull failures by pulling sequentially with retries.
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl restart docker 2>/dev/null || systemctl restart docker 2>/dev/null || true
            fi
            pull_with_retry() {
              local img="$1"
              local attempt
              for attempt in 1 2 3 4 5; do
                if docker pull "$img"; then
                  return 0
                fi
                echo "pull failed for $img (attempt $attempt), retrying..."
                sleep $((attempt * 5))
              done
              echo "pull failed for $img after retries"
              return 1
            }
            pull_with_retry "ghcr.io/belforzedse/infinity-frontend:${IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --remove-orphans
            if ! docker image prune -f; then
              echo "Skipped prune: another operation is already running."
            fi
